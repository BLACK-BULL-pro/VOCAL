spring.application.name=vocal
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/vocal;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

vocal.websocket.allowed-origins=${VOCAL_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

# Bootstrap opcional del superusuario. Define estas variables antes de iniciar la app.
vocal.admin.email=${VOCAL_ADMIN_EMAIL:}
vocal.admin.password=${VOCAL_ADMIN_PASSWORD:}
vocal.admin.name=${VOCAL_ADMIN_NAME:Administrador V.O.C.A.L.}
