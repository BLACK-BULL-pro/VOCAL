services:
  - type: web
    name: vocal
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: SPRING_DATASOURCE_HOST
        fromDatabase:
          name: vocal-db
          property: host
      - key: SPRING_DATASOURCE_PORT
        fromDatabase:
          name: vocal-db
          property: port
      - key: SPRING_DATASOURCE_DB
        fromDatabase:
          name: vocal-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: vocal-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: vocal-db
          property: password
      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver
      - key: VOCAL_ALLOWED_ORIGINS
        sync: false
      - key: VOCAL_ADMIN_EMAIL
        sync: false
      - key: VOCAL_ADMIN_PASSWORD
        sync: false
      - key: VOCAL_ADMIN_NAME
        value: Administrador V.O.C.A.L.

databases:
  - name: vocal-db
    databaseName: vocal
    user: vocal
    plan: free
